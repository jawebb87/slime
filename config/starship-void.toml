# Starship Prompt Configuration - Abyssal Void Theme
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'void'

format = """
[\\[VOID//NULL\\]](bold fg:neon_pink) \
[❯](bold fg:electric_cyan) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ⚡](bold fg:electric_cyan)\
$line_break\
$character"""

[palettes.void]
deep_obsidian  = "#05060b"
electric_cyan  = "#00e5ff"
neon_pink      = "#ff007f"
neon_green     = "#06d6a0"
cobalt_blue    = "#3b82f6"
electric_violet= "#a855f7"
muted_slate    = "#475569"
starlight      = "#c8d6e5"

[username]
show_always = true
style_user = "bold fg:electric_violet"
style_root = "bold fg:neon_pink"
format = '[$user]($style)[:](bold fg:muted_slate)'

[directory]
style = "bold fg:electric_cyan"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold fg:neon_pink"
format = ' [\(git:](fg:muted_slate)[$branch]($style)[\)](fg:muted_slate)'

[git_status]
style = "bold fg:electric_cyan"
format = ' [$all_status$ahead_behind]($style)'

[python]
symbol = " "
style = "fg:neon_green"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:neon_pink"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:electric_cyan"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:neon_green"
format = ' [$symbol($version)]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:muted_slate"
format = ' [⏱ $duration]($style)'


[docker_context]
symbol = " "
style = "fg:neon_pink"
format = ' [$symbol$context]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:neon_pink"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[◆](bold fg:electric_cyan)"
error_symbol = "[▲](bold fg:neon_pink)"
