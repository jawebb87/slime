<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Glowing dropshadow filter -->
  <defs>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- High-contrast neon green muskrat head outline directly from image_1.png top bar -->
  <g stroke="#39ff14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#laser-glow)">
    <!-- Round ear -->
    <path d="M 28 32 C 24 24, 32 18, 38 23 C 41 26, 41 30, 40 34" />
    
    <!-- Cranium and snout profile -->
    <path d="M 40 34 C 48 30, 62 36, 74 48 C 77 52, 78 55, 75 58 C 72 60, 68 60, 65 60" />

    <!-- Two distinct buck teeth -->
    <path d="M 70 60 L 70 66 L 66 66 L 66 60" fill="#39ff14" stroke-width="2" />
    <path d="M 66 60 L 66 65 L 62 65 L 62 60" fill="#39ff14" stroke-width="2" />

    <!-- Lower jaw and throat curve -->
    <path d="M 62 60 C 56 68, 44 72, 32 68 C 24 62, 22 48, 28 32" />

    <!-- Cyberpunk visor ocular band -->
    <path d="M 46 39 L 66 48" stroke="#39ff14" stroke-width="5.5" />
  </g>
</svg>
