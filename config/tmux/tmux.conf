# ==============================================================================
# Slime Desktop — TMUX Configuration
# ==============================================================================

# Enable TrueColor / 24-bit color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",rxvt-unicode-256color:RGB"
set -as terminal-features ",lxterminal:RGB"

# Enable mouse support
set -g mouse on

# Set prefix to Ctrl-a (while retaining Ctrl-b as secondary)
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Increase tmux messages display duration
set -g display-time 2000

# Refresh status line every 5 seconds
set -g status-interval 5

# Easy splits in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload tmux config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# Load active theme (synced via theme-toggle)
if-shell '[ -f ~/.config/tmux/theme.conf ]' 'source-file ~/.config/tmux/theme.conf'
