# Tmux theme - red (Doom)
set -g status-style "bg=#0e0708,fg=#faebe8"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff1a2a,fg=#0e0708,bold] #S #[bg=default,fg=#ff1a2a] "
set -g status-right "#[fg=#ba6874]%H:%M #[fg=#ff3b4b,bold]#H "
set -g window-status-format "#[fg=#ba6874]#I:#W"
set -g window-status-current-format "#[fg=#ff2a3a,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#4a171e"
set -g pane-active-border-style "fg=#ff1a2a"
set -g message-style "bg=#ff1a2a,fg=#0e0708,bold"
