# Tmux theme - Mothgomery (Lamplit Workshop)
set -g status-style "bg=#142a30,fg=#efdfbf"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#e8bb76,fg=#0d1c21,bold] 󰈹 #S #[bg=default,fg=#e8bb76] "
set -g status-right "#[fg=#f3d395]󰚌 Mothgomery #[fg=#9b9e8c]%H:%M #[fg=#df9774,bold]#H "
set -g window-status-format "#[fg=#9b9e8c]#I:#W"
set -g window-status-current-format "#[fg=#e8bb76,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#142a30"
set -g pane-active-border-style "fg=#e8bb76"
set -g message-style "bg=#e8bb76,fg=#0d1c21,bold"
