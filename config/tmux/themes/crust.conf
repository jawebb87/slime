# Tmux theme - Crust (Crustpunk Drifter & Alleyway Phantom)
set -g status-style "bg=#1a1716,fg=#f5f5f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#f4d06f,fg=#0f0e0f,bold] 󰈸 #S #[bg=default,fg=#f4d06f] "
set -g status-right "#[fg=#f4d06f]󰊠 Crust #[fg=#a8a29e]%H:%M #[fg=#d97706,bold]#H "
set -g window-status-format "#[fg=#a8a29e]#I:#W"
set -g window-status-current-format "#[fg=#f4d06f,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#3a322c"
set -g pane-active-border-style "fg=#f4d06f"
set -g message-style "bg=#f4d06f,fg=#0f0e0f,bold"
