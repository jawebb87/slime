# Tmux theme - slime
set -g status-style "bg=#0c140d,fg=#c6f582"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#4ee24e,fg=#0c140d,bold] #S #[bg=default,fg=#4ee24e] "
set -g status-right "#[fg=#2f4433]%H:%M #[fg=#4ee24e,bold]#H "
set -g window-status-format "#[fg=#2f4433]#I:#W"
set -g window-status-current-format "#[fg=#4ee24e,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#132015"
set -g pane-active-border-style "fg=#4ee24e"
set -g message-style "bg=#4ee24e,fg=#0c140d,bold"
