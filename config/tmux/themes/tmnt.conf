# Tmux theme - Teenage Mutant Ninja Turtles (Heroes in a Half Shell)
set -g status-style "bg=#0e1510,fg=#d8ebd8"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#39ff14,fg=#0e1510,bold] 🐢 #S #[bg=default,fg=#39ff14] "
set -g status-right "#[fg=#ffd700]🍕 Cowabunga #[fg=#5a7d5f]%H:%M #[fg=#00aaff,bold]#H "
set -g window-status-format "#[fg=#5a7d5f]#I:#W"
set -g window-status-current-format "#[fg=#39ff14,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#1e3022"
set -g pane-active-border-style "fg=#39ff14"
set -g message-style "bg=#39ff14,fg=#0e1510,bold"
