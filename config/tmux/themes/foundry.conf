# Foundry — Victorian Engine Room
set -g status-style "bg=#232927,fg=#dfd4b9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#dfd4b9,fg=#101414,bold] #S #[bg=default,fg=#dfd4b9] "
set -g status-right "#[fg=#8f9382]%H:%M #[fg=#d3b77c,bold]#H "
set -g window-status-format "#[fg=#8f9382]#I:#W"
set -g window-status-current-format "#[fg=#dfd4b9,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#232927"
set -g pane-active-border-style "fg=#dfd4b9"
set -g message-style "bg=#dfd4b9,fg=#101414,bold"
