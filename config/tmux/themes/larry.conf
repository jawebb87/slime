# Tmux theme - larry
set -g status-style "bg=#111415,fg=#e2f5ec"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#39ff14,fg=#111415,bold] #S #[bg=default,fg=#39ff14] "
set -g status-right "#[fg=#5c776c]%H:%M #[fg=#39ff14,bold]#H "
set -g window-status-format "#[fg=#5c776c]#I:#W"
set -g window-status-current-format "#[fg=#39ff14,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#181c1c"
set -g pane-active-border-style "fg=#39ff14"
set -g message-style "bg=#39ff14,fg=#111415,bold"
