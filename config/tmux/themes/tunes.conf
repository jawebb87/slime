# Tmux theme - Looney Tunes (Light Theme)
set -g status-style "bg=#faf5eb,fg=#1c1612"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#d91424,fg=#ffffff,bold] #S #[bg=default,fg=#d91424] "
set -g status-right "#[fg=#61554c]%H:%M #[fg=#005bbb,bold]#H "
set -g window-status-format "#[fg=#61554c]#I:#W"
set -g window-status-current-format "#[fg=#d91424,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#dcd3c5"
set -g pane-active-border-style "fg=#d91424"
set -g message-style "bg=#d91424,fg=#ffffff,bold"
