# Tmux theme - windbreaker
set -g status-style "bg=#f4f6fa,fg=#151324"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff007f,fg=#ffffff,bold] #S #[bg=default,fg=#ff007f] "
set -g status-right "#[fg=#625c7e]%H:%M #[fg=#00d2ff,bold]#H "
set -g window-status-format "#[fg=#625c7e]#I:#W"
set -g window-status-current-format "#[fg=#ff007f,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#cbd5e1"
set -g pane-active-border-style "fg=#ff007f"
set -g message-style "bg=#ff007f,fg=#ffffff,bold"
