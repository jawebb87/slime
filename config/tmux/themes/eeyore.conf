set -g status-style "bg=#e7efee,fg=#34444e"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#326d8b,fg=#f3f6f3,bold] 󰈹 #S #[bg=default,fg=#326d8b] "
set -g status-right "#[fg=#866a2e]󰚌 Eeyore — Watercolor Sky #[fg=#697d85]%H:%M #[fg=#a34f69,bold]#H "
set -g window-status-format "#[fg=#697d85]#I:#W"
set -g window-status-current-format "#[fg=#326d8b,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#e7efee"
set -g pane-active-border-style "fg=#326d8b"
set -g message-style "bg=#326d8b,fg=#f3f6f3,bold"
