set -g status-style "bg=#1a2228,fg=#d8e1e5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#d6584d,fg=#0b0f12,bold] 󰈹 #S #[bg=default,fg=#d6584d] "
set -g status-right "#[fg=#d5af58]󰚌 SCP Facility #[fg=#93a3ad]%H:%M #[fg=#ff7564,bold]#H "
set -g window-status-format "#[fg=#93a3ad]#I:#W"
set -g window-status-current-format "#[fg=#d6584d,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#1a2228"
set -g pane-active-border-style "fg=#d6584d"
set -g message-style "bg=#d6584d,fg=#0b0f12,bold"
