# Tmux theme - Muppet Babies (Pastel Vaporwave Dreams)
set -g status-style "bg=#1a1528,fg=#f0e6f6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff70a6,fg=#1a1528,bold] ✨ #S #[bg=default,fg=#ff70a6] "
set -g status-right "#[fg=#ffd166]🧸 Muppet Babies #[fg=#8b7a9e]%H:%M #[fg=#80ed99,bold]#H "
set -g window-status-format "#[fg=#8b7a9e]#I:#W"
set -g window-status-current-format "#[fg=#ff70a6,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#2e2346"
set -g pane-active-border-style "fg=#ff70a6"
set -g message-style "bg=#ff70a6,fg=#1a1528,bold"
