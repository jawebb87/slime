# Tmux theme - Speedster and Crew (Cozy Cartoon Hangout)
set -g status-style "bg=#140d0d,fg=#f9cda7"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#cb6d25,fg=#140d0d,bold] 🏎️ #S #[bg=default,fg=#cb6d25] "
set -g status-right "#[fg=#dd9868]⚡ Speedster & Crew #[fg=#8a6d5f]%H:%M #[fg=#605526,bold]#H "
set -g window-status-format "#[fg=#8a6d5f]#I:#W"
set -g window-status-current-format "#[fg=#cb6d25,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#3a211a"
set -g pane-active-border-style "fg=#cb6d25"
set -g message-style "bg=#cb6d25,fg=#140d0d,bold"
