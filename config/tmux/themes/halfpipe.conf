set -g status-style "bg=#27322e,fg=#e5e6d6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#9cdb45,fg=#171e1c,bold] 󰈹 #S #[bg=default,fg=#9cdb45] "
set -g status-right "#[fg=#e6c56a]󰚌 Halfpipe #[fg=#9eada1]%H:%M #[fg=#df6094,bold]#H "
set -g window-status-format "#[fg=#9eada1]#I:#W"
set -g window-status-current-format "#[fg=#9cdb45,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#27322e"
set -g pane-active-border-style "fg=#9cdb45"
set -g message-style "bg=#9cdb45,fg=#171e1c,bold"
