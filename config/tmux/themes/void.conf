# Tmux theme - Abyssal Void
set -g status-style "bg=#080c16,fg=#c8d6e5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#00e5ff,fg=#05060b,bold] #S #[bg=default,fg=#00e5ff] "
set -g status-right "#[fg=#475569]%H:%M #[fg=#ff007f,bold]#H "
set -g window-status-format "#[fg=#475569]#I:#W"
set -g window-status-current-format "#[fg=#00e5ff,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#0c101c"
set -g pane-active-border-style "fg=#00e5ff"
set -g message-style "bg=#00e5ff,fg=#05060b,bold"
