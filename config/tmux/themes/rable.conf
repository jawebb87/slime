# Tmux theme - Miss Rable (Neon Punk Alleyway)
set -g status-style "bg=#12101b,fg=#cbd5e1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff2a85,fg=#0a0812,bold] 󰊠 #S #[bg=default,fg=#ff2a85] "
set -g status-right "#[fg=#00f0ff]󰝚 Miss Rable #[fg=#5a5261]%H:%M #[fg=#ff2a85,bold]#H "
set -g window-status-format "#[fg=#5a5261]#I:#W"
set -g window-status-current-format "#[fg=#ff2a85,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#181424"
set -g pane-active-border-style "fg=#ff2a85"
set -g message-style "bg=#ff2a85,fg=#0a0812,bold"
