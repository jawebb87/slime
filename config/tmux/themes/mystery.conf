# Tmux theme - Mystery Machine (Scooby-Doo Spooky Night & Flower Power)
set -g status-style "bg=#10151d,fg=#d4e5ea"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#1cd1be,fg=#10151d,bold] 🌸 #S #[bg=default,fg=#1cd1be] "
set -g status-right "#[fg=#88e22c]🚐 Mystery Machine #[fg=#6b8594]%H:%M #[fg=#ff7700,bold]#H "
set -g window-status-format "#[fg=#6b8594]#I:#W"
set -g window-status-current-format "#[fg=#1cd1be,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#1d2c3a"
set -g pane-active-border-style "fg=#1cd1be"
set -g message-style "bg=#1cd1be,fg=#10151d,bold"
