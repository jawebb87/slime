# Tmux theme - Clay Tablet
set -g status-style "bg=#413a3b,fg=#d1c4af"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#d1c4af,fg=#2b2526,bold] #S #[bg=default,fg=#d1c4af] "
set -g status-right "#[fg=#8b817e]%H:%M #[fg=#d49b52,bold]#H "
set -g window-status-format "#[fg=#8b817e]#I:#W"
set -g window-status-current-format "#[fg=#d1c4af,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#413a3b"
set -g pane-active-border-style "fg=#d1c4af"
set -g message-style "bg=#d1c4af,fg=#2b2526,bold"
