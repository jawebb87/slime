set -g status-style "bg=#142229,fg=#d9e7ec"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#79c9c3,fg=#080f13,bold] 󰈹 #S #[bg=default,fg=#79c9c3] "
set -g status-right "#[fg=#c4b788]󰚌 The Well #[fg=#92a6ae]%H:%M #[fg=#cd8792,bold]#H "
set -g window-status-format "#[fg=#92a6ae]#I:#W"
set -g window-status-current-format "#[fg=#79c9c3,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#142229"
set -g pane-active-border-style "fg=#79c9c3"
set -g message-style "bg=#79c9c3,fg=#080f13,bold"
