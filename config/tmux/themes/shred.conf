# Tmux theme - shred
set -g status-style "bg=#0b0c0e,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7a889b,fg=#0b0c0e,bold] #S #[bg=default,fg=#7a889b] "
set -g status-right "#[fg=#4a5260]%H:%M #[fg=#7a889b,bold]#H "
set -g window-status-format "#[fg=#4a5260]#I:#W"
set -g window-status-current-format "#[fg=#7a889b,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#14171c"
set -g pane-active-border-style "fg=#7a889b"
set -g message-style "bg=#7a889b,fg=#0b0c0e,bold"
