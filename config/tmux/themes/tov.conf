# Tmux theme - Molly Tov (Street Riot & Anarchy)
set -g status-style "bg=#1e1a1c,fg=#f1faee"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#f77f00,fg=#0f0d0e,bold] 󰈸 #S #[bg=default,fg=#f77f00] "
set -g status-right "#[fg=#70e000]󰊠 Molly Tov #[fg=#a8dadc]%H:%M #[fg=#e63946,bold]#H "
set -g window-status-format "#[fg=#a8dadc]#I:#W"
set -g window-status-current-format "#[fg=#f77f00,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#2d272a"
set -g pane-active-border-style "fg=#f77f00"
set -g message-style "bg=#f77f00,fg=#0f0d0e,bold"
