set -g status-style "bg=#211531,fg=#d9efcf"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#91e66d,fg=#100c20,bold] 󰈹 #S #[bg=default,fg=#91e66d] "
set -g status-right "#[fg=#cbe889]󰚌 The Bamboo Corsair #[fg=#9a9cac]%H:%M #[fg=#ef8198,bold]#H "
set -g window-status-format "#[fg=#9a9cac]#I:#W"
set -g window-status-current-format "#[fg=#91e66d,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#211531"
set -g pane-active-border-style "fg=#91e66d"
set -g message-style "bg=#91e66d,fg=#100c20,bold"
