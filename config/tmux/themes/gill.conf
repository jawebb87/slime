# Tmux theme - Baron von Gill (Subterranean Grotto)
set -g status-style "bg=#0c1520,fg=#cbd5e1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#00f5d4,fg=#080e15,bold] 󰈹 #S #[bg=default,fg=#00f5d4] "
set -g status-right "#[fg=#fbbf24]󰚌 Baron von Gill #[fg=#475569]%H:%M #[fg=#fb7185,bold]#H "
set -g window-status-format "#[fg=#475569]#I:#W"
set -g window-status-current-format "#[fg=#00f5d4,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#0c1520"
set -g pane-active-border-style "fg=#00f5d4"
set -g message-style "bg=#00f5d4,fg=#080e15,bold"
