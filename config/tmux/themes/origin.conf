# Tmux theme - origin
set -g status-style "bg=#141712,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#9ece6a,fg=#141712,bold] #S #[bg=default,fg=#9ece6a] "
set -g status-right "#[fg=#3b3228]%H:%M #[fg=#9ece6a,bold]#H "
set -g window-status-format "#[fg=#3b3228]#I:#W"
set -g window-status-current-format "#[fg=#9ece6a,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#141712"
set -g pane-active-border-style "fg=#9ece6a"
set -g message-style "bg=#9ece6a,fg=#141712,bold"
