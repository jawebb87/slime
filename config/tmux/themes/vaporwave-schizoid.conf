set -g status-style "bg=#21163f,fg=#f0ddff"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff55c8,fg=#110c27,bold] 󰈹 #S #[bg=default,fg=#ff55c8] "
set -g status-right "#[fg=#ffba8c]󰚌 Vaporwave Schizoid #[fg=#a99bcc]%H:%M #[fg=#ff719f,bold]#H "
set -g window-status-format "#[fg=#a99bcc]#I:#W"
set -g window-status-current-format "#[fg=#ff55c8,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#21163f"
set -g pane-active-border-style "fg=#ff55c8"
set -g message-style "bg=#ff55c8,fg=#110c27,bold"
