# Tmux theme - Wake & Bake (420 Special)
set -g status-style "bg=#111618,fg=#e5dfd5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#48b852,fg=#0d1411,bold] 󰌪 420 #[bg=default,fg=#48b852] "
set -g status-right "#[fg=#f4a226]🌿 Wake & Bake #[fg=#70857b]%H:%M #[fg=#4ee2ec,bold]#H "
set -g window-status-format "#[fg=#70857b]#I:#W"
set -g window-status-current-format "#[fg=#48b852,bold]#[underscore]#I:#W#[default]"
pane_border_col="#1a2622"
set -g pane-border-style "fg=#1a2622"
set -g pane-active-border-style "fg=#48b852"
set -g message-style "bg=#48b852,fg=#0d1411,bold"
