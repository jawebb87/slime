# Tmux theme - Grindhouse JAWS (Terror from the Deep)
set -g status-style "bg=#14252d,fg=#ecdfbf"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#e8bd4e,fg=#0b151b,bold] 󰈹 #S #[bg=default,fg=#e8bd4e] "
set -g status-right "#[fg=#f5d675]󰚌 Grindhouse JAWS #[fg=#a4aaa3]%H:%M #[fg=#ef7160,bold]#H "
set -g window-status-format "#[fg=#a4aaa3]#I:#W"
set -g window-status-current-format "#[fg=#e8bd4e,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#14252d"
set -g pane-active-border-style "fg=#e8bd4e"
set -g message-style "bg=#e8bd4e,fg=#0b151b,bold"
