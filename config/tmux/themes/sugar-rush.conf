set -g status-style "bg=#f4e3fa,fg=#603575"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#a33c83,fg=#fff1fb,bold] 󰈹 #S #[bg=default,fg=#a33c83] "
set -g status-right "#[fg=#916b26]󰚌 Sugar Rush #[fg=#8b7197]%H:%M #[fg=#b74c85,bold]#H "
set -g window-status-format "#[fg=#8b7197]#I:#W"
set -g window-status-current-format "#[fg=#a33c83,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#f4e3fa"
set -g pane-active-border-style "fg=#a33c83"
set -g message-style "bg=#a33c83,fg=#fff1fb,bold"
