# Tmux theme - space
set -g status-style "bg=#f5f6f9,fg=#1b2028"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#0d8a52,fg=#f5f6f9,bold] #S #[bg=default,fg=#0d8a52] "
set -g status-right "#[fg=#5a6578]%H:%M #[fg=#0d8a52,bold]#H "
set -g window-status-format "#[fg=#5a6578]#I:#W"
set -g window-status-current-format "#[fg=#0d8a52,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#1b2028"
set -g pane-active-border-style "fg=#0d8a52"
set -g message-style "bg=#0d8a52,fg=#f5f6f9,bold"
