# Tmux theme - Darkwing Duck (The Terror That Flaps in the Night)
set -g status-style "bg=#120c1f,fg=#e2daf0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#00e5ff,fg=#120c1f,bold] ⚡ #S #[bg=default,fg=#00e5ff] "
set -g status-right "#[fg=#ffd700]🦆 Darkwing Duck #[fg=#7c6a99]%H:%M #[fg=#ff6b00,bold]#H "
set -g window-status-format "#[fg=#7c6a99]#I:#W"
set -g window-status-current-format "#[fg=#00e5ff,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#261a40"
set -g pane-active-border-style "fg=#00e5ff"
set -g message-style "bg=#00e5ff,fg=#120c1f,bold"
