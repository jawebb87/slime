# Tmux theme - I'm Sorry Jon (Cosmic Horror Lasagna)
set -g status-style "bg=#0f0c0b,fg=#e8dcc4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#e0562e,fg=#0f0c0b,bold] 👁 #S #[bg=default,fg=#e0562e] "
set -g status-right "#[fg=#e5a93c]🍴 I'm Sorry Jon #[fg=#8a7b6d]%H:%M #[fg=#5c7f87,bold]#H "
set -g window-status-format "#[fg=#8a7b6d]#I:#W"
set -g window-status-current-format "#[fg=#e0562e,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#2c1e1c"
set -g pane-active-border-style "fg=#e0562e"
set -g message-style "bg=#e0562e,fg=#0f0c0b,bold"
