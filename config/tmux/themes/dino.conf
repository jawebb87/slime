# Tmux theme - Dino Might (Radioactive Bruiser & Street Riot)
set -g status-style "bg=#16161a,fg=#f4f4f5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#76ff03,fg=#0c0c0e,bold] 󰈸 #S #[bg=default,fg=#76ff03] "
set -g status-right "#[fg=#76ff03]󰊠 Dino Might #[fg=#a1a1aa]%H:%M #[fg=#ff6d00,bold]#H "
set -g window-status-format "#[fg=#a1a1aa]#I:#W"
set -g window-status-current-format "#[fg=#76ff03,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#2e2d36"
set -g pane-active-border-style "fg=#76ff03"
set -g message-style "bg=#76ff03,fg=#0c0c0e,bold"
