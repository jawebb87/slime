set -g status-style "bg=#f5efd9,fg=#39382f"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#246d9b,fg=#fffbed,bold] 󰈹 #S #[bg=default,fg=#246d9b] "
set -g status-right "#[fg=#a16c18]󰚌 Crayon Chomp #[fg=#8a806a]%H:%M #[fg=#b84435,bold]#H "
set -g window-status-format "#[fg=#8a806a]#I:#W"
set -g window-status-current-format "#[fg=#246d9b,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#f5efd9"
set -g pane-active-border-style "fg=#246d9b"
set -g message-style "bg=#246d9b,fg=#fffbed,bold"
