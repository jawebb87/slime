set -g status-style "bg=#29211e,fg=#dbc3a0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#b63d30,fg=#171311,bold] 󰈹 #S #[bg=default,fg=#b63d30] "
set -g status-right "#[fg=#c38d52]󰚌 Satanic Panic! #[fg=#a68b73]%H:%M #[fg=#d65a3d,bold]#H "
set -g window-status-format "#[fg=#a68b73]#I:#W"
set -g window-status-current-format "#[fg=#b63d30,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#29211e"
set -g pane-active-border-style "fg=#b63d30"
set -g message-style "bg=#b63d30,fg=#171311,bold"
