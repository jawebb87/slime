# Tmux theme - lab
set -g status-style "bg=#f7f9fb,fg=#0a0c0e"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#0f766e,fg=#f7f9fb,bold] #S #[bg=default,fg=#0f766e] "
set -g status-right "#[fg=#475569]%H:%M #[fg=#0f766e,bold]#H "
set -g window-status-format "#[fg=#475569]#I:#W"
set -g window-status-current-format "#[fg=#0f766e,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#0a0c0e"
set -g pane-active-border-style "fg=#0f766e"
set -g message-style "bg=#0f766e,fg=#f7f9fb,bold"
