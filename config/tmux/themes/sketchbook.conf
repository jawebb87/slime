set -g status-style "bg=#f6efdf,fg=#343b39"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#276c67,fg=#faf4e7,bold] 󰈹 #S #[bg=default,fg=#276c67] "
set -g status-right "#[fg=#86591f]󰚌 Sketchbook #[fg=#686b60]%H:%M #[fg=#945b29,bold]#H "
set -g window-status-format "#[fg=#686b60]#I:#W"
set -g window-status-current-format "#[fg=#276c67,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#f6efdf"
set -g pane-active-border-style "fg=#276c67"
set -g message-style "bg=#276c67,fg=#faf4e7,bold"
