# Tmux theme - cyber
set -g status-style "bg=#090812,fg=#e0d8f6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#55f736,fg=#090812,bold] #S #[bg=default,fg=#55f736] "
set -g status-right "#[fg=#4c3f78]%H:%M #[fg=#55f736,bold]#H "
set -g window-status-format "#[fg=#4c3f78]#I:#W"
set -g window-status-current-format "#[fg=#55f736,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#090812"
set -g pane-active-border-style "fg=#55f736"
set -g message-style "bg=#55f736,fg=#090812,bold"
