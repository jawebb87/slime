set -g status-style "bg=#272a24,fg=#ddd7c0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ef4148,fg=#161815,bold] 󰈹 #S #[bg=default,fg=#ef4148] "
set -g status-right "#[fg=#d1ac63]󰚌 Punk Show! #[fg=#9c9e8b]%H:%M #[fg=#f46b66,bold]#H "
set -g window-status-format "#[fg=#9c9e8b]#I:#W"
set -g window-status-current-format "#[fg=#ef4148,bold]#[underscore]#I:#W#[default]"
set -g pane-border-style "fg=#272a24"
set -g pane-active-border-style "fg=#ef4148"
set -g message-style "bg=#ef4148,fg=#161815,bold"
