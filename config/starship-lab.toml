# Starship Prompt Configuration - Laboratory White Theme (Pre-Contamination)
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'lab'

format = """
[](fg:neon_lime)\
$os\
$username\
[](bg:swamp_mid fg:neon_lime)\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$time\
$cmd_duration\
$status\
$line_break\
$character"""

[palettes.lab]
neon_lime     = "#0a0c0e"
swamp_deep    = "#ffffff"
swamp_dark    = "#e2e8f0"
swamp_mid     = "#dde4ec"
swamp_accent  = "#cbd5e1"
toxic_yellow  = "#0284c7"
pale_lichen   = "#0a0c0e"
hazard_red    = "#dc2626"
bright_text   = "#ffffff"
dim_text      = "#475569"

[os]
disabled = false
style = "bg:neon_lime fg:swamp_deep bold"
format = '[$symbol]($style)'

[os.symbols]
Arch = " "
Debian = " "
Ubuntu = " "
Linux = " "

[username]
show_always = true
style_user = "bg:neon_lime fg:swamp_deep bold"
style_root = "bg:hazard_red fg:bright_text bold"
format = '[$user ]($style)'

[directory]
style = "bg:swamp_mid fg:pale_lichen"
format = "[  $path ]($style)[](fg:swamp_mid)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music"     = ""
"Pictures"  = ""
"Projects"  = "󰲋"

[git_branch]
symbol = " "
style = "bg:swamp_accent fg:toxic_yellow bold"
format = '[](fg:swamp_mid bg:swamp_accent)[ $symbol$branch]($style)'

[git_status]
style = "bg:swamp_accent fg:toxic_yellow"
format = '[$all_status$ahead_behind ]($style)[](fg:swamp_accent)'

[python]
symbol = " "
style = "bg:swamp_dark fg:pale_lichen"
format = '[](fg:swamp_mid bg:swamp_dark)[ $symbol($version) ]($style)[](fg:swamp_dark)'

[rust]
symbol = " "
style = "bg:swamp_dark fg:toxic_yellow"
format = '[](fg:swamp_mid bg:swamp_dark)[ $symbol($version) ]($style)[](fg:swamp_dark)'

[golang]
symbol = " "
style = "bg:swamp_dark fg:pale_lichen"
format = '[](fg:swamp_mid bg:swamp_dark)[ $symbol($version) ]($style)[](fg:swamp_dark)'

[nodejs]
symbol = " "
style = "bg:swamp_dark fg:pale_lichen"
format = '[](fg:swamp_mid bg:swamp_dark)[ $symbol($version) ]($style)[](fg:swamp_dark)'

[docker_context]
symbol = " "
style = "bg:swamp_dark fg:toxic_yellow"
format = '[](fg:swamp_mid bg:swamp_dark)[ $symbol$context ]($style)[](fg:swamp_dark)'

[time]
disabled = false
time_format = "%R"
style = "fg:dim_text"
format = ' [ $time]($style)'

[cmd_duration]
min_time = 2000
style = "bold fg:toxic_yellow"
format = ' [⏱ $duration]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:hazard_red"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[└─](bold fg:toxic_yellow)[❯](bold fg:neon_lime) "
error_symbol = "[└─](bold fg:hazard_red)[❯](bold fg:hazard_red) "
