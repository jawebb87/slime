# Starship Prompt Configuration - Standalone: "Larry the Haxor" / LARRY_0x_MUSKRAT
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'larry'

format = """
[\\[SYS_BREACH//LARRY_0x\\]](bold fg:toxic_green) \
[❯](bold fg:toxic_green) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ 🦫](bold fg:toxic_green)\
$line_break\
$character"""

[palettes.larry]
chassis_dark = "#151718"
swamp_teal   = "#0d2e27"
alert_amber  = "#ffb000"
recess_teal  = "#080a0a"
cyber_blue   = "#a5b4fc"
toxic_green  = "#39ff14"
unread_moss  = "#1f3e37"
laser_white  = "#f0f4f8"

[username]
show_always = true
style_user = "bold fg:cyber_blue"
style_root = "bold fg:alert_amber"
format = '[$user]($style)[:](bold fg:toxic_green)'

[directory]
style = "bold fg:toxic_green"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold fg:toxic_green"
format = ' [\(git:](fg:unread_moss)[$branch]($style)[\)](fg:unread_moss)'

[git_status]
style = "bold fg:alert_amber"
format = ' [$all_status$ahead_behind]($style)'

[python]
symbol = " "
style = "fg:toxic_green"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:alert_amber"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:cyber_blue"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:toxic_green"
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = " "
style = "fg:cyber_blue"
format = ' [$symbol$context]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:alert_amber"
format = ' [⏱ $duration]($style)'

[status]
disabled = false
style = "bold fg:alert_amber"
format = ' [\[EXIT:$status\]]($style)'

[character]
success_symbol = "[❯❯](bold fg:toxic_green) "
error_symbol = "[❯❯](bold fg:alert_amber) "
