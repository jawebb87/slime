# Starship Prompt Configuration - Act I: Laboratory White (Pre-Contamination Console)
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'lab'

format = """
[\\[LAB//SYS\\]](bold fg:lab_teal) \
[❯](bold fg:clinical_blue) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ⚗](bold fg:lab_teal)\
$line_break\
$character"""

[palettes.lab]
ink_black     = "#0a0c0e"
lab_teal      = "#0f766e"
clinical_blue = "#0284c7"
cobalt_blue   = "#1d4ed8"
slate_muted   = "#64748b"
amber_warn    = "#b45309"
hazard_red    = "#dc2626"

[username]
show_always = true
style_user = "bold fg:ink_black"
style_root = "bold fg:hazard_red"
format = '[$user]($style)[:](bold fg:slate_muted)'

[directory]
style = "bold fg:clinical_blue"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold fg:lab_teal"
format = ' [\(git:](fg:slate_muted)[$branch]($style)[\)](fg:slate_muted)'

[git_status]
style = "bold fg:amber_warn"
format = ' [$all_status$ahead_behind]($style)'

[python]
symbol = " "
style = "fg:lab_teal"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:amber_warn"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:clinical_blue"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:lab_teal"
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = " "
style = "fg:clinical_blue"
format = ' [$symbol$context]($style)'

[cmd_duration]
min_time = 2000
style = "bold fg:amber_warn"
format = ' [⏱ $duration]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:hazard_red"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[❯](bold fg:lab_teal)[❯](bold fg:clinical_blue) "
error_symbol = "[❯](bold fg:hazard_red)[❯](bold fg:hazard_red) "
