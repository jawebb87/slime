# Starship Prompt Configuration - Act II: Biohazard Slime (Contamination Terminal)
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'slime'

format = """
[\\[BIO//HAZARD\\]](bold fg:neon_lime) \
[❯](bold fg:toxic_yellow) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ☣](bold fg:neon_lime)\
$line_break\
$character"""

[palettes.slime]
neon_lime     = "#55f736"
hyper_lime    = "#74ff2e"
bio_teal      = "#36e385"
toxic_yellow  = "#d8eb34"
pale_lichen   = "#c6f582"
hazard_red    = "#ff4343"
dim_text      = "#709677"

[username]
show_always = true
style_user = "bold fg:neon_lime"
style_root = "bold fg:hazard_red"
format = '[$user]($style)[:](bold fg:dim_text)'

[directory]
style = "bold fg:pale_lichen"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold fg:toxic_yellow"
format = ' [\(git:](fg:bio_teal)[$branch]($style)[\)](fg:bio_teal)'

[git_status]
style = "bold fg:hazard_red"
format = ' [$all_status$ahead_behind]($style)'

[python]
symbol = " "
style = "fg:neon_lime"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:toxic_yellow"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:bio_teal"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:neon_lime"
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = " "
style = "fg:bio_teal"
format = ' [$symbol$context]($style)'

[cmd_duration]
min_time = 2000
style = "bold fg:toxic_yellow"
format = ' [⏱ $duration]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:hazard_red"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[❯](bold fg:neon_lime)[❯](bold fg:toxic_yellow) "
error_symbol = "[❯](bold fg:hazard_red)[❯](bold fg:hazard_red) "
