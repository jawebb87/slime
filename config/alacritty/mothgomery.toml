[window]
opacity = 0.92
padding = { x = 10, y = 10 }

[font]
size = 7.0
normal = { family = "JetBrainsMono Nerd Font" }

[colors.primary]
background = "#0d1c21"
foreground = "#efdfbf"

[colors.cursor]
cursor = "#e8bb76"
text   = "#0d1c21"

[colors.selection]
background = "#354d48"
