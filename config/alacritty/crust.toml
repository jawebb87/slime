[window]
opacity = 0.92
padding = { x = 10, y = 10 }

[font]
size = 7.0
normal = { family = "JetBrainsMono Nerd Font" }

[colors.primary]
background = "#0f0e0f"
foreground = "#f5f5f4"

[colors.cursor]
cursor = "#f4d06f"
text   = "#0f0e0f"

[colors.selection]
background = "#27221f"
