[colors.normal]
black   = "#1a1716"
red     = "#991b1b"
green   = "#65a30d"
yellow  = "#f4d06f"
blue    = "#38bdf8"
magenta = "#c084fc"
cyan    = "#a8a29e"
white   = "#cbd5e1"

[colors.bright]
black   = "#3a322c"
red     = "#dc2626"
green   = "#84cc16"
yellow  = "#d97706"
blue    = "#60a5fa"
magenta = "#e879f9"
