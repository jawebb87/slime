[colors.normal]
black   = "#151d28"
red     = "#ff3864"
green   = "#88e22c"
yellow  = "#ff7700"
blue    = "#1cd1be"
magenta = "#b062ff"
cyan    = "#38e1d0"
white   = "#d4e5ea"

[colors.bright]
black   = "#2a3d4f"
red     = "#ff577d"
green   = "#a4f553"
yellow  = "#ffd000"
blue    = "#48fae7"
magenta = "#ca8dff"
cyan    = "#6bf0e2"
white   = "#ffffff"
