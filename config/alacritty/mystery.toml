[window]
opacity = 0.94
padding = { x = 10, y = 10 }

[font]
size = 7.0
normal = { family = "ComicShannsMono Nerd Font" }

[colors.primary]
background = "#10151d"
foreground = "#d4e5ea"

[colors.cursor]
cursor = "#1cd1be"
text   = "#10151d"

[colors.selection]
background = "#1d2c3a"
