[window]
opacity = 1.0
padding = { x = 10, y = 10 }

[font]
size = 7.0
normal = { family = "JetBrainsMono Nerd Font" }

[colors.primary]
background = "#100c20"
foreground = "#d9efcf"

[colors.cursor]
cursor = "#91e66d"
text   = "#100c20"

[colors.selection]
