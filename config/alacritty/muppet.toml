[window]
opacity = 0.94
padding = { x = 10, y = 10 }

[font]
size = 7.0
normal = { family = "ComicShannsMono Nerd Font" }

[colors.primary]
background = "#1a1528"
foreground = "#f0e6f6"

[colors.cursor]
cursor = "#ff70a6"
