# Kitty Terminal Configuration - Laboratory White Theme (Pre-Contamination)

# Font Configuration
font_family      MartianMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Laboratory White Color Palette
# Background & Foreground
background            #f7f9fb
foreground            #0a0c0e
selection_background  #0a0c0e
selection_foreground  #ffffff
cursor                #0a0c0e
cursor_text_color     #ffffff
url_color             #0284c7

