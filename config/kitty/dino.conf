# Kitty Terminal Configuration - Dino Might Theme
# Radioactive Bruiser & Street Riot (RADIOACTIVE // MIGHT)

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #0c0c0e
foreground            #f4f4f5
selection_background  #222228
selection_foreground  #ffffff
cursor                #76ff03
cursor_text_color     #0c0c0e
url_color             #76ff03

