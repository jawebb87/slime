# Kitty Terminal Configuration - Cyberpunk Future Theme (Bio-Grid Cyberdeck)

# Font Configuration
font_family      ZedMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# Window & Transparency
background_opacity 0.93
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Cyberpunk Future Color Palette (Obsidian UV + Toxic Slime Power Core)
# Background & Foreground
background            #090812
foreground            #e0d8f6
selection_background  #7928ca
selection_foreground  #ffffff
cursor                #00f0ff
cursor_text_color     #090812
url_color             #00f0ff

# Black / Obsidian & Deep Indigo
color0   #090812
color8   #4c3f78

# Red / Hot Magenta (Critical Alerts & Breakpoints)
color1   #ff007f
color9   #ff3399

# Green (Bio-Slime Power Source / Residual Infection)
color2   #55f736
color10  #74ff2e

# Yellow (High-Voltage Acid / Bio-Amber)
color3   #d8eb34
color11  #f3ff47

# Blue (Deep UV Neon Violet)
color4   #7928ca
color12  #a855f7

# Magenta (Core Electric Purple)
color5   #a855f7
color13  #c084fc

# Cyan (High-Voltage Acid Cyan)
color6   #00f0ff
color14  #5ce1e6

# White / Bioluminescent Off-White
color7   #e0d8f6
color15  #ffffff
