# Kitty Terminal Configuration - Abyssal Void Theme
# Psychedelic Glitch & Liquid Singularity

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

