# Kitty Terminal Configuration - Mystery Machine Theme
# Spooky Nights & Groovy Flower Power (SCOOBY // MYSTERY)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #10151d
foreground            #d4e5ea
selection_background  #1d2c3a
selection_foreground  #ffffff
cursor                #1cd1be
cursor_text_color     #10151d
url_color             #1cd1be

# Black / Deep Midnight Mist
color0   #151d28
color8   #2a3d4f

# Red / Spooky Alert Red
color1   #ff3864
color9   #ff577d

# Green / Groovy Lime Green
color2   #88e22c
color10  #a4f553

# Yellow / Flower Power Tangerine Orange & Gold
color3   #ff7700
color11  #ffd000

# Blue / Mystery Machine Turquoise Aqua
