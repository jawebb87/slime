# Kitty Terminal Configuration - "Chomp the Haxor" / CHOMP_0x Cyber-Swamp
# High-Readability Monolithic Brutalist Cyber Palette

# Font Configuration
font_family      BigBlueTermPlus Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Base Chassis & Laser Highlights
background            #111415
foreground            #e2f5ec
selection_background  #163b31
selection_foreground  #39ff14
cursor                #39ff14
cursor_text_color     #111415
url_color             #39ff14

# Black / Chassis & Readable Comments
