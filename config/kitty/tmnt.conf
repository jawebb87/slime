# Kitty Terminal Configuration - Teenage Mutant Ninja Turtles (TMNT) Theme
# Heroes in a Half Shell (NYC // COWABUNGA)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #0e1510
foreground            #d8ebd8
selection_background  #1e3022
selection_foreground  #ffffff
cursor                #39ff14
cursor_text_color     #0e1510
url_color             #39ff14

