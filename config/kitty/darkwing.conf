# Kitty Terminal Configuration - Darkwing Duck Theme
# The Terror That Flaps in the Night (ST.CANARD // DANGEROUS)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #120c1f
foreground            #e2daf0
selection_background  #261a40
selection_foreground  #ffffff
cursor                #00e5ff
cursor_text_color     #120c1f
url_color             #00e5ff

