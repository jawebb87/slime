# Kitty Terminal Configuration - Slime Theme

# Font Configuration
font_family      OpenDyslexicM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window & Transparency
background_opacity 0.88
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Slime Color Palette
# Background & Foreground
background            #0c140d
foreground            #c6f582
selection_background  #25452a
selection_foreground  #f4ffd6
cursor                #64f830
cursor_text_color     #0c140d
url_color             #e5ff4d

# Black / Dark Swamp
color0   #132015
color8   #2f4433

# Red (Kept vivid & recognizable so errors pop immediately)
color1   #ff4343
color9   #ff6666

# Green (Radioactive Slime)
color2   #4ee24e
color10  #74ff2e

# Yellow (Toxic Acid Yellow)
color3   #d8eb34
color11  #f3ff47

# Blue -> Olive / Apple Slime
color4   #7cb324
color12  #9fe825

# Magenta -> Acid Chartreuse / Yellow-Amber
color5   #b8cc29
color13  #d6eb3b

# Cyan -> Seafoam & Glowing Algae Green
color6   #36e385
color14  #55ffaa

# White -> Pale Lichen & Luminescent Slime White
color7   #c8ecc0
color15  #eeffdc
