# ==============================================================================
# Kitty Terminal Configuration - Act IV: Orbital Containment / Deep Space Vessel
# ==============================================================================

# Font Configuration (Monaspace Radon — Vector Flight Charts & Orbital Telemetry)
font_family      SpaceMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Window Layout & Padding
window_padding_width 10
placement_strategy center
confirm_os_window_close 0
enable_audio_bell no

# Background Opacity (Pressurized Hull White)
background_opacity 0.96
dynamic_background_opacity yes

# Cursor Customization (Solar Flare Gold)
cursor #e59500
cursor_text_color #f5f6f9
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# URL Handling (Thruster Cyan)
url_color #0088cc
url_style curly
detect_urls yes

# Tab Bar Styling (Hull White + Airframe Grey + Solar Flare Gold)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1b2028
active_tab_background   #e59500
active_tab_font_style   bold
inactive_tab_foreground #4a5568
inactive_tab_background #e1e4ea
inactive_tab_font_style normal
tab_bar_background      #f5f6f9

# ==============================================================================
# Color Scheme: Act IV — Flight Deck Light Palette (Hull White, Solar Gold & Thruster Cyan)
# ==============================================================================
foreground              #1b2028
background              #f5f6f9
selection_foreground    #1b2028
selection_background    #e1e4ea

# Window Borders
active_border_color     #e59500
inactive_border_color   #e1e4ea
bell_border_color       #d32f2f

# Black (Deep Nav Slate & Pressurized Cabin Grey)
color0  #1b2028
color8  #5a6578

# Red (Airlock Red & Hull Breach Alert)
color1  #d32f2f
color9  #b71c1c

# Green (Cryo-Stasis Containment Emerald / Dormant Specimen)
color2  #0d8a52
color10 #15a362

# Yellow / Gold (Solar Flare Gold & Hull Seal Amber)
color3  #c25d00
color11 #e59500

# Blue / Cyan (Thruster Cyan & Deep Orbit Nav)
color4  #0088cc
color12 #006699

# Magenta (Telemetry Violet / Starlight Relay)
color5  #6b46c1
color13 #553c9a

# Cyan (Cryo Coolant & Orbital Transponder)
color6  #0088cc
color14 #0077b3

# White (Airframe Grey & Hull White)
color7  #333d4b
color15 #1b2028
