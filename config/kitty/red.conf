# ==============================================================================
# Kitty Terminal Configuration - Doom (Rip & Tear)
# ==============================================================================
# Shades of red main theme with ANSI red mapped to green for error pop.

font_family      GohuFont 11 Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 10
confirm_os_window_close 0
background_opacity 0.94

cursor #ff1a2a
cursor_text_color #0e0708
cursor_shape beam
cursor_beam_thickness 2.0

foreground            #faebe8
background            #0e0708
selection_foreground  #ffffff
selection_background  #5c141d

url_color #ffaa00
url_style straight

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
active_tab_foreground   #ffffff
active_tab_background   #ff1a2a
active_tab_font_style   bold
inactive_tab_foreground #ba6874
inactive_tab_background #220c10
inactive_tab_font_style normal
tab_bar_background      #0e0708

# 16-Color Doom Palette
# Black (Obsidian / Scorched Iron)
color0  #2c0e13
color8  #ba6874

# Red (Mapped to Acid Green so errors stand out!)
color1  #39ff14
color9  #55ff55

# Green (Crimson / Scarlet)
color2  #ff2a3f
color10 #ff6073

# Yellow (Crucible Flame / Argent Amber)
color3  #ffaa00
color11 #ffd033

# Blue (Argent Plasma Blue)
color4  #38bdf8
color12 #7dd3fc

# Magenta (Demonic Crucible Violet)
color5  #e040fb
color13 #ea80fc

# Cyan (BFG / Argent Cyan)
color6  #00e5ff
color14 #67e8f9

# White (Bone White)
color7  #faebe8
color15 #ffffff
