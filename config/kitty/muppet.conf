# Kitty Terminal Configuration - Muppet Babies Theme
# Dreams Come True (NURSERY // VAPORWAVE)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
