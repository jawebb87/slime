# Kitty Terminal Configuration - Clay Tablet Theme
# Sunbaked Terracotta & Mesopotamian Cuneiform

# Font Configuration
font_family      IosevkaTermSlab Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Clay Tablet Color Palette
# Background (Deep Scorched Slate Clay) & Foreground (Sandstone Slip)
background            #352f30
foreground            #d1c4af
selection_background  #585153
selection_foreground  #ffffff
cursor                #e4dccf
cursor_text_color     #2b2526
url_color             #d49b52

# Black / Dark Incised Shadow
color0   #2b2526
color8   #6e6563

# Red / Terracotta Seal Red
