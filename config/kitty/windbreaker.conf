# Kitty Terminal Configuration - 90s Neon Windbreaker Theme (Light Theme)

# Font Configuration
font_family      ComicShannsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window & Transparency
background_opacity 0.95
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# 90s Windbreaker Color Palette
# Background (Light crisp nylon off-white) & Foreground (Deep indigo ink)
background            #f4f6fa
foreground            #151324
selection_background  #ff007f
selection_foreground  #ffffff
cursor                #ff007f
cursor_text_color     #ffffff
url_color             #0077cc

# Black / Deep Indigo Ink
color0   #151324
color8   #625c7e

# Red / Neon Hot Pink (High-Voltage Magenta)
color1   #ff2a5f
color9   #ff007f

# Green / Electric Lime (Peak 90s Neon Green)
color2   #05b34c
color10  #10e862

# Yellow / Cyber Highlighter (Electric Solar Yellow)
color3   #bfa100
color11  #ffe600

# Blue / Electric Cyan (Vintage Sportswear Cyan)
color4   #0077cc
color12  #00d2ff

# Magenta / Deep Royal Purple (Retro Color-Block Accent)
color5   #9d00b8
color13  #ff1493

# Cyan / High-Voltage Teal
color6   #009688
color14  #00f0ff

# Slate / High-Contrast Ink
color7   #3a3552
color15  #000000
