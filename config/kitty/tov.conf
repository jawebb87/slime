# Kitty Terminal Configuration - Molly Tov Theme
# Street Riot & Burning Anarchy (ANARCHY // TOV)

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #0f0d0e
foreground            #f1faee
selection_background  #2d272a
selection_foreground  #ffffff
cursor                #f77f00
cursor_text_color     #0f0d0e
url_color             #f77f00

# Black / Smoky Grime & Urban Slate
color0   #1e1a1c
color8   #2d272a

# Red / Anarchist Red & Bright Flame Red
color1   #e63946
color9   #ff4d5a

# Green / Mohawk Green & Acid Neon Green
