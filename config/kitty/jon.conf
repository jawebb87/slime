# Kitty Terminal Configuration - I'm Sorry Jon Theme
# The Flesh is Weak (COSMIC // HORROR // LASAGNA)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #0f0c0b
foreground            #e8dcc4
selection_background  #2c1e1c
selection_foreground  #ffffff
cursor                #e0562e
cursor_text_color     #0f0c0b
url_color             #e5a93c

