# ==============================================================================
# Kitty Terminal Configuration - Standalone: The Shredder (Gunmetal & Angles)
# ==============================================================================
# Abyssal Chute (#0b0c0e), Gunmetal (#14171c), Honed Razor Steel (#e2e8f0),
# Brushed Tungsten (#8b95a5), Friction Spark Red (#ff2a2a), Hot Grinding Orange (#ff5500)

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window Layout & Padding
window_padding_width 10
confirm_os_window_close 0
background_opacity 0.94

# Cursor (Honed Razor Blade Edge with dark gunmetal text)
cursor #e2e8f0
cursor_text_color #0b0c0e
cursor_shape beam
cursor_beam_thickness 2.0

# Core Colors
foreground            #d8dee9
background            #0b0c0e
selection_foreground  #0b0c0e
selection_background  #c8d0dc

# URL highlight
url_color #ff5500
url_style straight

# Tab Bar (Angular Gunmetal Blades)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
active_tab_foreground   #0b0c0e
active_tab_background   #c8d0dc
active_tab_font_style   bold
inactive_tab_foreground #8b95a5
inactive_tab_background #14171c
inactive_tab_font_style normal
tab_bar_background      #0b0c0e

# 16-Color Industrial Shredder Palette (Gunmetal, Cold Steel, & Friction Sparks)
# Black (Abyssal Chute / Machined Gunmetal)
color0  #14171c
color8  #4a5260

# Red (Pinch-Point Crimson / High-RPM Spark Red)
color1  #ff2a2a
color9  #ff5555

# Green (Cold Tempered Alloy / Steel Patina)
color2  #7a889b
color10 #9aa7b8

# Yellow (Grinding Spark Orange / Molten Slag)
color3  #ff5500
color11 #ff8800

# Blue (Cold Blued Gunmetal / Hardened Tungsten)
color4  #5c6e84
color12 #7b90ab

# Magenta (Heat-Treated Titanium / Forged Alloy)
color5  #9e6b78
color13 #c28897

# Cyan (Honed Razor Steel / Specular Blade Edge)
color6  #a8b5c7
color14 #c8d0dc

# White (Brushed Steel / Specular White Edge)
color7  #c8d0dc
color15 #ffffff
