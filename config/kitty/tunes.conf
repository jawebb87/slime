# Kitty Terminal Configuration - Looney Tunes Cartoon Theme (Light Theme)

# Font Configuration
font_family      ComicShannsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window & Transparency
background_opacity 0.95
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Looney Tunes Color Palette
# Background (Vintage warm cartoon cel cream) & Foreground (Deepest cartoon ink black)
background            #faf5eb
foreground            #1c1612
selection_background  #fed7aa
selection_foreground  #1c1612
cursor                #d91424
cursor_text_color     #ffffff
url_color             #005bbb

# Black / Ink Black & Outline Graphite
color0   #1c1612
color8   #61554c

# Red (Acme Dynamite Red / Poppy Cherry)
color1   #c8102e
color9   #e02238

# Green (Marvin Martian Green / Poppy Toon Clover)
color2   #0c7a36
color10  #129443

# Yellow (Daffy Bill Amber / Tweety Golden Marigold)
color3   #b85d00
color11  #cf6f00

# Blue (Warner Azure / Road Runner Sky Blue)
color4   #005bbb
color12  #027be3

# Magenta (Cartoon Mallet Purple / Poppy Toon Magenta)
color5   #86198f
color13  #a21caf

# Cyan (Cartoon Whistle Teal / Splash Cyan)
color6   #007788
color14  #0090a8

# White (Dark Ink Slate / Bold Stark Ink)
color7   #52463e
color15  #1c1612
