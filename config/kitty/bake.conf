# Kitty Terminal Configuration - Wake & Bake (420 Special)
# All the weeds, all the times

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
