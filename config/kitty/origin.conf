# ==============================================================================
# Kitty Terminal Configuration - Act 0: The Specimen Origin / Deep Wood
# ==============================================================================

# Font Configuration (Naturalist Field-Journal with Script Italics)
font_family      MonaspiceRn Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Window Layout & Padding
window_padding_width 10
placement_strategy center
confirm_os_window_close 0
enable_audio_bell no

# Background Opacity
background_opacity 0.94
dynamic_background_opacity yes

# Cursor Customization (Bioluminescent Spore)
cursor #9ece6a
cursor_text_color #141712
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# URL Handling (Damp Moss / Spore)
url_color #9ece6a
url_style curly
detect_urls yes

# Tab Bar Styling (Bark & Timber + Bioluminescent Spore)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #141712
active_tab_background   #9ece6a
active_tab_font_style   bold
inactive_tab_foreground #5a784d
inactive_tab_background #241e17
inactive_tab_font_style italic
tab_bar_background      #141712

# ==============================================================================
# Color Scheme: Act 0 — Forest Soil, Bark & Bioluminescent Spores
# ==============================================================================
foreground              #d8dee9
background              #141712
selection_foreground    #d8dee9
selection_background    #241e17

# Window Borders
active_border_color     #9ece6a
inactive_border_color   #241e17
bell_border_color       #d08770

# Black (Deep Forest Soil & Bark Timber)
color0  #141712
color8  #3b3228

# Red / Clay (Weathered Amber & Rust Berry)
color1  #d08770
color9  #bf616a

# Green (Bioluminescent Spore & Lichen Moss)
color2  #9ece6a
color10 #b5e48c

# Yellow (Golden Mycelium & Amber Sap)
color3  #ebcb8b
color11 #d08770

# Blue / Foliage (Lichen / Damp Moss & Forest Canopy)
color4  #5a784d
color12 #7fa96b

# Magenta (Wild Forest Orchid / Spore Cap)
color5  #b48ead
color13 #c8a2c8

# Cyan (Damp Creek / Morning Dew)
color6  #8fbcbb
color14 #a3d3d2

# White (Spore White & Chalky Mycelium)
color7  #d8dee9
color15 #eceff4
