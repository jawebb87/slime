# Kitty Terminal Configuration - Crust Theme
# Crustpunk Drifter & Alleyway Phantom (CRUST // DUMPSTER)

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #0f0e0f
foreground            #f5f5f4
selection_background  #27221f
selection_foreground  #ffffff
cursor                #f4d06f
cursor_text_color     #0f0e0f
url_color             #f4d06f

# Black / Smoked Rust Brick & Rusted Steel
color0   #1a1716
color8   #3a322c

