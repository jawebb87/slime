# Kitty Terminal Configuration - Grindhouse JAWS Theme
# Midnight ocean / weathered print / blood red

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.97
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Workshop Palette
background            #0b151b
foreground            #ecdfbf
selection_background  #354a50
selection_foreground  #ffffff
cursor                #e8bd4e
cursor_text_color     #0b151b
url_color             #e8bd4e

# Black / Deep Trench
color0   #14252d
color8   #a4aaa3

