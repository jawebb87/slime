# Kitty Terminal Configuration - Speedster and Crew Theme
# Cozy Cartoon Hangout (SPEEDSTER // CREW // CLUBHOUSE)

# Font Configuration
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Transparency
background_opacity 0.94
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# The Foundation (Backgrounds & Foreground)
background            #140d0d
foreground            #f9cda7
selection_background  #4f2a17
selection_foreground  #fff2e3
cursor                #cb6d25
cursor_text_color     #140d0d
url_color             #dd9868

