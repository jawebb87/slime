"$schema" = 'https://starship.rs/config-schema.json'

palette = 'moonlit-well'

format = """
[\\[THE//WELL\\]](bold fg:copper) \
[❯](bold fg:lamp_brass) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ⚡](bold fg:lamp_brass)\
$line_break\
$character"""

[palettes.moonlit-well]
workshop_dark   = "#080f13"
lamp_brass    = "#79c9c3"
copper    = "#cd8792"
copper_dark    = "#a75f73"
moss   = "#9bb9cb"
lamp_glow   = "#c4b788"
fungal_teal    = "#9bb9cb"
weathered_stone    = "#92a6ae"
parchment      = "#d9e7ec"

[username]
show_always = true
style_user = "bold fg:lamp_glow"
style_root = "bold fg:copper_dark"
format = '[$user]($style)[:](bold fg:weathered_stone)'

[directory]
style = "bold fg:lamp_brass"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold fg:copper"
format = " [󰊢 $branch]($style)"

[git_status]
style = "bold fg:moss"
format = "([$all_status$ahead_behind]($style))"

[cmd_duration]
min_time = 2_000
style = "bold fg:lamp_glow"
format = " [󱦟 $duration]($style)"


[python]
symbol = " "
style = "fg:lamp_glow"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:copper"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:moss"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:lamp_glow"
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = " "
style = "fg:copper"
format = ' [$symbol$context]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:copper_dark"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[❯](bold fg:lamp_brass)"
error_symbol = "[❯](bold fg:copper)"
