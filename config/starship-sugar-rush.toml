"$schema" = 'https://starship.rs/config-schema.json'

palette = 'sugar-rush'

format = """
[\\[SUGAR//RUSH\\]](bold fg:copper) \
[❯](bold fg:lamp_brass) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ♡](bold fg:lamp_brass)\
$line_break\
$character"""

[palettes.sugar-rush]
workshop_dark   = "#fff1fb"
lamp_brass    = "#a33c83"
copper    = "#b74c85"
copper_dark    = "#af467f"
moss   = "#45836b"
lamp_glow   = "#916b26"
fungal_teal    = "#45836b"
weathered_stone    = "#8b7197"
parchment      = "#603575"

[username]
show_always = true
style_user = "bold fg:lamp_glow"
style_root = "bold fg:copper_dark"
format = '[$user]($style)[:](bold fg:weathered_stone)'

[directory]
style = "bold fg:lamp_brass"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold fg:copper"
format = " [󰊢 $branch]($style)"

[git_status]
style = "bold fg:moss"
format = "([$all_status$ahead_behind]($style))"

[cmd_duration]
min_time = 2_000
style = "bold fg:lamp_glow"
format = " [󱦟 $duration]($style)"


[python]
symbol = " "
style = "fg:lamp_glow"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:copper"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:moss"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:lamp_glow"
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = " "
style = "fg:copper"
format = ' [$symbol$context]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:copper_dark"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[❯](bold fg:lamp_brass)"
error_symbol = "[❯](bold fg:copper)"
