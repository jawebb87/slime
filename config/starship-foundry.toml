# Foundry — Victorian Engine Room
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'foundry'

format = """
[\\[FOUNDRY//ENGINE\\]](bold fg:terracotta) \
[❯](bold fg:sandstone) \
$username\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$docker_context\
$cmd_duration\
$status\
[ ⚙](bold fg:ochre)\
$line_break\
$character"""

[palettes.foundry]
dark_foundry   = "#101414"
slate_foundry  = "#30362f"
sandstone   = "#dfd4b9"
bone_white  = "#f7ecd2"
terracotta  = "#c97455"
ochre       = "#d3b77c"
sage        = "#91ae83"
lapis       = "#7d9ca8"
muted_silt  = "#8f9382"

[username]
show_always = true
style_user = "bold fg:ochre"
style_root = "bold fg:terracotta"
format = '[$user]($style)[:](bold fg:muted_silt)'

[directory]
style = "bold fg:sandstone"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold fg:terracotta"
format = ' [\(git:](fg:muted_silt)[$branch]($style)[\)](fg:muted_silt)'

[git_status]
style = "bold fg:ochre"
format = ' [$all_status$ahead_behind]($style)'

[python]
symbol = " "
style = "fg:sage"
format = ' [$symbol($version)]($style)'

[rust]
symbol = " "
style = "fg:terracotta"
format = ' [$symbol($version)]($style)'

[golang]
symbol = " "
style = "fg:lapis"
format = ' [$symbol($version)]($style)'

[nodejs]
symbol = " "
style = "fg:sage"
format = ' [$symbol($version)]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:muted_silt"
format = ' [⏱ $duration]($style)'


[docker_context]
symbol = " "
style = "fg:terracotta"
format = ' [$symbol$context]($style)'

[status]
disabled = false
symbol = " ✘"
style = "bold fg:terracotta"
format = '[$symbol $status]($style)'

[character]
success_symbol = "[◆](bold fg:sandstone)"
error_symbol = "[▲](bold fg:terracotta)"
