# Picom v13 Configuration - Clay Tablet Theme

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded Corners for clay tablets
corner-radius = 6;

frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

# Smooth organic fade
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

# Deep earthen shadow (Tactile clay slab ambient occlusion)
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.42;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#2b2526";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.94;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'dock'";
    shadow = true;
    corner-radius = 0;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.98;
    corner-radius = 6;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 6;
  }
);
