# Picom v13 Configuration - Looney Tunes Theme (Light Theme)

# Backend & Rendering
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded Corners (Handled via AwesomeWM shape masks)
corner-radius = 6;

# Frame & Borders
frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Shadows (Soft vintage warm cartoon shadow with subtle ink tint)
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.22;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#1c1612";

# Rules (Picom v13 modern syntax)
rules: (
  {
    match = "!focused";
    opacity = 0.96;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.98;
    corner-radius = 6;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    opacity = 1.0;
  }
);
