# Foundry — gear silhouettes are shaped by AwesomeWM.
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

corner-radius = 0;

frame-opacity = 1.0;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#090c0b";

rules: (
  {
    match = "!focused";
    opacity = 0.93;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.92;
    corner-radius = 6;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
