# Picom v13 Configuration - Dino Might Theme
# Radioactive Bruiser & Street Riot

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Sharp/Rounded urban corners
corner-radius = 8;

frame-opacity = 1.0;

# Rich frosted glass blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Fast riot snap fade
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;

# Deep smoky soot shadows with wet asphalt tone
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.72;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#060608";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.94;
    dim = 0.08;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 8;
  }
);
