# ==============================================================================
# Picom v13 Configuration - "Larry the Haxor" / LARRY_0x_MUSKRAT Cyber-Swamp
# ==============================================================================

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Zero corner radius: Monolithic chamfers & sharp 90° corners dominate
corner-radius = 0;

frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

# Fast mechanical snap fade
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# Deep Chassis & Swamp Teal Shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.70;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#080a0a";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.90;
    dim = 0.16;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
