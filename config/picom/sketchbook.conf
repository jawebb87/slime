
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

corner-radius = 3;

frame-opacity = 1.0;

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = false;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.18;
shadow-offset-x = 2;
shadow-offset-y = 3;
shadow-color = "#514b40";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 3;
  }
);
