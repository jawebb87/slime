# Picom v13 Configuration - Mystery Machine Theme
# Spooky Nights & Groovy Flower Power (SCOOBY // MYSTERY)

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Clean retro cartoon rounded corners
corner-radius = 8;

frame-opacity = 1.0;

# Rich eerie frosted mist blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Smooth mystical fade
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# Deep midnight spooky shadows with ambient dark blue/teal rim
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.75;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#04080e";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.94;
    dim = 0.08;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 8;
  }
);
