# ==============================================================================
# Picom v13 Configuration - Standalone: The Shredder (Gunmetal & Razor Angles)
# ==============================================================================

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Zero corner radius so AwesomeWM's XShape shredder teeth & chamfers are razor-sharp
corner-radius = 0;

frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Fast mechanical snap fade
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# Shadows (Deep Abyssal Chute Shadow with subtle steel contrast)
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.72;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#050608";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.90;
    dim = 0.18;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
