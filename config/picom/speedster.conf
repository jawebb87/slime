# Picom v13 Configuration - Speedster and Crew Theme
# Cozy Cartoon Hangout (SPEEDSTER // CREW // CLUBHOUSE)

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Warm cartoon rounded corners
corner-radius = 6;

frame-opacity = 1.0;

# Soft atmospheric dual kawase blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Snap fade
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;

# Warm cozy clubhouse shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.85;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#070404";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.94;
    dim = 0.10;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 8;
  }
);
