# Picom v13 Configuration - Mothgomery Theme
# Lamplit Workshop & Lamplit Caverns

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded corners for grotto pods
corner-radius = 8;

frame-opacity = 1.0;

# Rich frosted glass blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Smooth lamplit fade
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# Deep cavern shadow with soft aquatic depth
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.68;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#071115";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.94;
    dim = 0.08;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 8;
  }
);
