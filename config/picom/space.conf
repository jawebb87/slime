# ==============================================================================
# Picom Configuration - Act IV: Orbital Containment / Deep Space Vessel
# ==============================================================================

backend = "glx";
vsync = true;
use-damage = true;

# Crisp Spacecraft HUD Corners (Double-Pencil Edge & Laser-Etched Corner Brackets)
corner-radius = 0;

# Hard Orbital Solar / Bulkhead Drop Shadow
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#1b2028";

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

# Window Rules
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.98;
  full-shadow = false;
}, {
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
  shadow = false;
}, {
  match = "class_g = 'slock'";
  corner-radius = 0;
  shadow = false;
  fade = false;
}, {
  match = "class_g = 'awesome'";
  corner-radius = 0;
}, {
  match = "window_type = 'normal' && !focused";
  dim = 0.05;
  opacity = 0.96;
})
