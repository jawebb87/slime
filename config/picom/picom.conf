# Picom v13 Configuration - Laboratory White Theme (Pre-Contamination)

# Backend & Rendering
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded Corners (Handled via AwesomeWM shape masks)
corner-radius = 0;

# Frame & Borders
frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Shadows (Crisp clinical dark drop shadow)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.30;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";

# Rules (Picom v13 modern syntax)
rules: (
  {
    match = "!focused";
    opacity = 0.94;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.95;
    corner-radius = 4;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
