# Picom v13 Configuration - Slime Theme

# Backend & Rendering
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded Corners (Handled via AwesomeWM Cairo dripping shape masks)
corner-radius = 0;

# Frame & Borders
frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Shadows (Bioluminescent slime glow)
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.50;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#45e62b";

# Rules (Picom v13 modern syntax)
rules: (
  {
    match = "!focused";
    opacity = 0.92;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.90;
    corner-radius = 8;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
