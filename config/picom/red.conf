# ==============================================================================
# Picom v13 Configuration - Doom (Rip & Tear)
# ==============================================================================

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

corner-radius = 0;

frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Fast mechanical snap fade
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# Shadows (Blood Red / Crimson Glow)
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.72;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#1f0408";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.90;
    dim = 0.18;
  },
  {
    match = "window_type = 'dock'";
    shadow = true;
    corner-radius = 0;
  },
  {
    match = "window_type = 'desktop'";
    shadow = false;
    corner-radius = 0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = false;
    opacity = 0.95;
    corner-radius = 0;
  },
  {
    match = "class_g = 'awesome' && window_type != 'dock'";
    shadow = false;
  },
  {
    match = "name = 'AwesomeWM Notification' || class_g = 'Naughty'";
    shadow = true;
    opacity = 1.0;
  }
);
