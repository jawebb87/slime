# Picom v13 Configuration - Abyssal Void Theme

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded corners for floating void pods
corner-radius = 8;

frame-opacity = 1.0;

# Rich frosted glass blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Fast cybernetic fade
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# Deep cosmic shadow
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.65;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#000000";

rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.92;
    dim = 0.12;
  },
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    blur-background = true;
    corner-radius = 0;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.98;
    corner-radius = 8;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = true;
    corner-radius = 8;
  }
);
