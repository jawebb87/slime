# Picom v13 Configuration - Cyberpunk Future Theme (Bio-Grid Cyberdeck)

# Backend & Rendering
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded Corners (Razor-sharp cyberdeck edges handled via AwesomeWM)
corner-radius = 0;

# Frame & Borders
frame-opacity = 1.0;

# Background Blurring (Dual Kawase)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Shadows (Electric Purple #a855f7 UV Neon Outer Glow)
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.58;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-color = "#a855f7";

# Rules (Picom v13 modern syntax: heavy inactive dimming so active window pops)
rules: (
  {
    match = "!focused && window_type != 'dock' && window_type != 'desktop'";
    opacity = 0.85;
    dim = 0.25;
  },
  {
    match = "focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.94;
    corner-radius = 2;
  },
  {
    match = "window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    corner-radius = 0;
  }
);
